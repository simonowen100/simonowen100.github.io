 <html>

 
   
 <style>

#weather-widget .location {
  line-height: 1.1;
  font-size: auto;
  font-weight: bold;
  margin-bottom: 10px;
  color:white;
  font-family: Pixelify Sans;
}

#weather-widget .feelslike {
  line-height: 1.1;
  font-size: auto;
  font-weight: bold;
  margin-bottom: 10px;
  color:white;
  font-family: Pixelify Sans;
}

#weather-widget .minmax {
  line-height: 1.1;
  font-size: auto;
  font-weight: bold;
  margin-bottom: 10px;
  color:white;
  font-family: Pixelify Sans;
}

#weather-widget .temp {
  margin-bottom: 15px;
  font-size: clamp(1cqi, 3vw, 40px);
  font-weight: bold;
  color:white;
  font-family: 'Fusion Pixel 10px Proportional JP', monospace;
}

#weather-widget {
  max-width:100px;
  display: flex;
  flex-direction: column;
  background-color: rgba(29, 232, 63, 0.15);
  padding: 5px;
  border: ridge 3px #1de840;
  border-radius: 3px;
  margin-bottom: 15px;
}

@media (max-width: 600px) {
    #weather-widget {
      flex-direction: row;
      flex-wrap:wrap;
      max-width: 100%;
    }
  }

.icon img {
  width:45px;
  display: flex;
}

#weather-widget .description {
  margin-top: 5px;
  font-size: clamp(150cqi);
  text-transform: capitalize;
  color:lightskyblue;
  font-weight:bold;
   font-family: 'Fusion Pixel 10px Proportional JP', monospace;
}

#weather-widget .details {
  margin-top: 15px;
  font-size: clamp(100cqi);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: space-between;
  color:white;
   font-family: 'Fusion Pixel 10px Proportional JP', monospace;
}


.sun-times {  
  gap: 6px;
}

  .img-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }

  .img-btn img {
  width:100px;
  }

  .img-btn:active img {
    transform: translateY(4px);
  }
   </style>


   <body style='color:white; background-color:black'>
   <div id="weather-widget">
  <div class="location">Melbourne, Australia</div>
   <div class="temp"></div>
  <div class="feelslike"></div>
 <div class="minmax">
    <div class="temp-min"></div>
    <div class="temp-max"></div>
  </div>
  <div class="icon"></div>
  <div class="description"></div>
  <div class="details"></div>
  <div class="sunrise sun-times"></div>
  <div class="sunset sun-times"></div>
  <div class="humidity"></div>
  <div class="wind"></div>
  

</div>
</body>

<script>

 const icons = {
  "Thunderstorm": "<img src='images/GIFs/Home/storm.gif'>",
  "Drizzle": "🌦️",
  "Rain": "<img src='images/GIFs/Home/rain.gif'>",
  "Snow": "❄️",
  "Mist": "🌫️",
  "Smoke": "🌫️",
  "Haze": "🌫️",
  "Dust": "🌫️",
  "Fog": "🌫️",
  "Sand": "🌫️",
  "Ash": "🌫️",
  "Squall": "🌬️",
  "Tornado": "🌪️",
  "Clear": "<img src='images/GIFs/Home/sun.gif'>",
  "Clouds": "<img src='images/GIFs/Home/cloud.gif'>"
};

function mapWeatherCodeToLabel(code) {
  if (code === 0 || code === 1) return "Clear";
  if (code === 2 || code === 3) return "Clouds";
  if ([45, 48].includes(code)) return "Fog";
  if ([51, 53, 55].includes(code)) return "Drizzle";
  if ([61, 63, 65, 80, 81, 82].includes(code)) return "Rain";
  if ([71, 73, 75].includes(code)) return "Snow";
  if ([95, 96, 99].includes(code)) return "Thunderstorm";
  return "Clear";
}

async function loadWeather() {
  const lat = -37.81;
  const lon = 144.96;

  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relative_humidity_2m&daily=temperature_2m_min,temperature_2m_max,sunrise,sunset&timezone=auto&forecast_days=1`;

  const response = await fetch(url);
  const data = await response.json();

  const current = data.current_weather;
  const daily = data.daily;

  document.querySelector(".temp").textContent =
    `${Math.round(current.temperature)}°C`;

  document.querySelector(".feelslike").textContent =
    `Feels like: ${Math.round(current.temperature)}°C`;

  const min = daily.temperature_2m_min[0];
  const max = daily.temperature_2m_max[0];

  document.querySelector(".temp-min").textContent = `Min: ${Math.round(min)}°C`;
  document.querySelector(".temp-max").textContent = `Max: ${Math.round(max)}°C`;

  document.querySelector(".wind").innerHTML =
    `<img style='height:20px' src="images/GIFs/Home/wind.gif" title="Wind Speed"> ${Math.round(current.windspeed)} km/h`;

  document.querySelector(".humidity").innerHTML =
    `<img style='height:20px' src="images/GIFs/Home/droplet.gif" title="Humidity"> ${data.hourly.relative_humidity_2m[0]}%`;

  document.querySelector(".sunrise").innerHTML =
    `<img src='images/GIFs/Home/sun2.gif'>
    Sunrise: ${new Date(daily.sunrise[0]).toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit'
    })}`;

  document.querySelector(".sunset").innerHTML =
    `<img src='images/GIFs/Home/moon.gif'>
    Sunset: ${new Date(daily.sunset[0]).toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit'
    })}`;

  const weatherCode = current.weathercode;

  const descriptions = {
    0: "Clear sky",
    1: "Mainly clear",
    2: "Partly cloudy",
    3: "Overcast",
    45: "Fog",
    48: "Depositing rime fog",
    51: "Light drizzle",
    53: "Moderate drizzle",
    55: "Dense drizzle",
    61: "Slight rain",
    63: "Moderate rain",
    65: "Heavy rain",
    71: "Slight snow",
    73: "Moderate snow",
    75: "Heavy snow",
    80: "Rain showers",
    81: "Rain showers",
    82: "Violent rain showers",
    95: "Thunderstorm",
    96: "Thunderstorm with slight hail",
    99: "Thunderstorm with heavy hail"
  };

  document.querySelector(".description").textContent =
    descriptions[weatherCode] || `Code ${weatherCode}`;

  const weatherLabel = mapWeatherCodeToLabel(weatherCode);
  document.querySelector(".icon").innerHTML =
    icons[weatherLabel] || "❓";
}

loadWeather();

</script>
</body>
</html>
